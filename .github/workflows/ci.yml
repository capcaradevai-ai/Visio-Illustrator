name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run test:node
      - run: npm run test:fidelity

  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test plugins/visio-scientific-illustrator/bridge/VisioBridge.sln -c Release --filter "Category!=VisioIntegration"
      - run: npm run build:bridge
      - uses: actions/upload-artifact@v4
        with:
          name: visio-scientific-illustrator-win-x64
          path: plugins/visio-scientific-illustrator/bin/win-x64/
          if-no-files-found: error
